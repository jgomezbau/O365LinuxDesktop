name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'V*'
      - 'v*'
  pull_request:

jobs:
  test:
    name: Test and package check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate Linux package layout
        run: npm run build:dir
