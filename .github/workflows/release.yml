name: Release

on:
  push:
    tags:
      - 'V*'
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Linux artifacts
        run: npx electron-builder --linux AppImage deb tar.gz --publish never

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          assets=(dist/*.AppImage dist/*.deb dist/*.tar.gz dist/*.yml)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No release artifacts found in dist/"
            exit 1
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" \
              --title "$TAG_NAME" \
              --notes "Release $TAG_NAME generated automatically by GitHub Actions."
          fi
